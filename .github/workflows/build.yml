name: Build Xbox UWP (Dev Mode)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbox-uwp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-xbox:
    name: Xbox Series / One (UWP x64)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install pycparser

      - name: Restore generated sources cache (prepare.py)
        id: cache-gen
        uses: actions/cache/restore@v4
        with:
          path: build/port/gen-x64
          key: khdays-gen-x64-${{ hashFiles('external/khdays-decomp/**', 'port/tools/**') }}
          restore-keys: |
            khdays-gen-x64-

      - name: Run prepare.py (generate native C sources)
        if: steps.cache-gen.outputs.cache-hit != 'true'
        run: python port/tools/prepare.py --out build/port/gen-x64

      - name: Save generated sources cache immediately
        if: steps.cache-gen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/port/gen-x64
          key: ${{ steps.cache-gen.outputs.cache-primary-key || format('khdays-gen-x64-{0}', hashFiles('external/khdays-decomp/**', 'port/tools/**')) }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake for UWP (Visual Studio 2022 x64)
        shell: pwsh
        run: |
          cmake -S port -B build-uwp `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            "-DCMAKE_SYSTEM_VERSION=10.0" `
            -DKHDAYS_UWP=ON `
            "-DKHDAYS_GEN=${{ github.workspace }}/build/port/gen-x64"

      - name: Generate Certificate & Build UWP Appx Package
        shell: pwsh
        run: |
          # 1. Extraer Publisher del manifiesto
          [xml]$manifest = Get-Content "port/uwp/Package.appxmanifest"
          $publisherId = $manifest.Package.Identity.Publisher
          Write-Host "Creating certificate for Publisher: $publisherId"

          # 2. Generar certificado autofirmado para UWP en Windows
          $cert = New-SelfSignedCertificate `
              -Subject $publisherId `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeySpec Signature `
              -KeyUsage DigitalSignature `
              -Type CodeSigningCert `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(2)

          $thumbprint = $cert.Thumbprint
          Write-Host "Certificate thumbprint: $thumbprint"

          # 3. Exportar certificado publico (.cer para la Xbox) y privado (.pfx para MSBuild)
          $certPassword = "XboxKhDaysDevPassword123!"
          $securePassword = ConvertTo-SecureString $certPassword -AsPlainText -Force

          New-Item -ItemType Directory -Force -Path "package-output"
          Export-Certificate -Cert $cert -FilePath "package-output/khdays-xbox.cer" | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath "UwpAutoSignCert.pfx" -Password $securePassword | Out-Null
          Copy-Item "UwpAutoSignCert.pfx" -Destination "build-uwp/UwpAutoSignCert.pfx" -Force

          # 4. Compilar y empaquetar con MSBuild
          $pfxPath = Join-Path $pwd "UwpAutoSignCert.pfx"
          $outPkgDir = Join-Path $pwd "package-output\"

          msbuild build-uwp/khdays-native.vcxproj /t:Rebuild `
            -maxcpucount `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint=$thumbprint `
            /p:PackageCertificateKeyFile=$pfxPath `
            /p:PackageCertificatePassword=$certPassword `
            /p:AppxPackageDir=$outPkgDir

          # 5. Limpiar certificado del almacén del runner
          Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force

      - name: Upload Xbox UWP Package and Certificate
        uses: actions/upload-artifact@v4
        with:
          name: KingdomHearts-358-2-Days-Xbox-UWP
          path: package-output/
